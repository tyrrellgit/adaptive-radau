[package]
name = "radau_rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Adaptive-order, adaptive-step Radau IIA integrator scaffold in Rust"

[dependencies]
nalgebra = { version = "0.33", features = ["std"] }
num-complex = "0.4"
thiserror = "1.0"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "integrator"
harness = false

[[bench]]
name = "tableau"
harness = false